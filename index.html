<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Special Memories ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <div class="card">

            <h1>Our Special Memories ❤️</h1>

            <p class="message">
                Every memory is special ✨
            </p>


            <!-- VIDEO -->

            <h2>🎬 Special Video</h2>

            <video
                class="video"
                controls>

                <source
                    src="video.mp4"
                    type="video/mp4">

                Your browser does not support video.

            </video>


            <!-- PHOTOS -->

            <h2>📸 Our Memories</h2>

            <div class="gallery">

                <img
                    src="photo1.jpg"
                    alt="Memory 1">

                <img
                    src="photo2.jpg"
                    alt="Memory 2">

                <img
                    src="photo3.jpg"
                    alt="Memory 3">

                <img
                    src="photo4.jpg"
                    alt="Memory 4">

            </div>


            <!-- SONG -->

            <h2>🎵 Our Song</h2>

            <button onclick="playSong()">

                ▶ Play Song

            </button>


            <audio id="song">

                <source
                    src="song.mp3"
                    type="audio/mpeg">

            </audio>


            <p class="footer">
                Made with ❤️
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

                    </html>
